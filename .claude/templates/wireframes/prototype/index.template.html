<!DOCTYPE html>
<!--
  CLICKABLE PROTOTYPE — fill-only skeleton for /spec Phase 2.5.
  Copy to specs/wireframes/prototype/index.html and replace [ … ] / TODO with the real product.
  Rules: self-contained (inline CSS+JS, NO CDN, opens offline), intent-level (mock data, NO backend),
  one section per screen, put a <span class="us">@US-XXX-Snn</span> badge next to each control so the @US toggle can surface them.
-->
<html lang="[xx]">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[PRODUCT] — Clickable Prototype (intent-level)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#0f172a}
  .toolbar{position:sticky;top:0;z-index:50;background:#0f172a;color:#fff;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;font-size:13px}
  .toolbar b{margin-right:6px}
  .toolbar button{background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
  .toolbar button:hover{background:#334155}.toolbar button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
  .toolbar .sep{width:1px;height:20px;background:#334155}
  .stage{display:flex;justify-content:center;padding:24px 12px}
  #app{width:100%;max-width:960px;transition:max-width .2s}
  body.mobile #app{max-width:390px;box-shadow:0 0 0 8px #1e293b;border-radius:24px;overflow:hidden;background:#fff}
  .screen{display:none}.screen.active{display:block}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:20px;margin-bottom:14px}
  .btn{background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
  .btn.ghost{background:#fff;color:#475569;border:1px solid #e2e8f0}
  .muted{color:#94a3b8;font-size:12px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
  input,textarea{width:100%;padding:9px 11px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px}
  .us{display:none;background:#ecfeff;border:1px solid #a5f3fc;color:#0e7490;border-radius:5px;font-size:10px;padding:1px 6px;margin-left:6px;font-weight:600}
  body.show-us .us{display:inline-block}
  .empty{text-align:center;color:#475569;border:1px dashed #e2e8f0;border-radius:10px;padding:40px}
</style>
</head>
<body class="desktop">

<div class="toolbar">
  <b>[PRODUCT] Prototype</b>
  <!-- TODO: one nav button per screen -->
  <button data-go="screenA" class="on">[Screen A]</button>
  <button data-go="screenB">[Screen B]</button>
  <button data-go="screenC">[Screen C / Form]</button>
  <span class="sep"></span>
  <button id="t-device">📱 Mobile</button>
  <button id="t-us">🏷 @US tags</button>
  <button id="t-empty">∅ Empty state</button>
  <span class="muted" style="margin-left:auto">intent-level · mock data · no backend</span>
</div>

<div class="stage"><div id="app">

  <!-- ============ SCREEN A (e.g. auth / landing) ============ -->
  <section class="screen active" id="screenA">
    <div class="card" style="max-width:380px;margin:30px auto">
      <h2>[Screen A title] <span class="us">@US-XXX</span></h2>
      <p class="muted">[ short description ]</p>
      <label>[Field]</label><input type="text" placeholder="[ … ]" />
      <div style="margin-top:16px"></div>
      <button class="btn" style="width:100%" data-go="screenB">[Primary action] <span class="us">@US-XXX-S01</span></button>
    </div>
  </section>

  <!-- ============ SCREEN B (e.g. list / dashboard) ============ -->
  <section class="screen" id="screenB">
    <div class="card">
      <div style="display:flex;align-items:center">
        <h2>[List title] <span class="us">@US-XXX</span></h2>
        <button class="btn" style="margin-left:auto" data-go="screenC">+ [Create] <span class="us">@US-XXX</span></button>
      </div>
      <input type="text" placeholder="🔎 [Search]…" style="margin:12px 0" oninput="render()" aria-label="[Search]" />
      <div id="list"><!-- rendered by JS --></div>
    </div>
  </section>

  <!-- ============ SCREEN C (e.g. form) ============ -->
  <section class="screen" id="screenC">
    <div class="card">
      <p><a class="muted" data-go="screenB" style="cursor:pointer">‹ Back</a></p>
      <label>[Field 1] *</label><input type="text" placeholder="[ … ]" />
      <label>[Field 2]</label><textarea rows="2" placeholder="[ … ]"></textarea>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn" data-go="screenB">[Save] <span class="us">@US-XXX-S01</span></button>
        <button class="btn ghost" data-go="screenB">[Cancel]</button>
      </div>
    </div>
  </section>

</div></div>

<script>
// ---- mock data (TODO: replace with the product's sample data) ----
let items = [ {id:1, title:"[Item one]"}, {id:2, title:"[Item two]"} ];
let forceEmpty = false;

function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id));
  document.querySelectorAll('.toolbar [data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===id));
  if(id==='screenB') render();
}
document.addEventListener('click', e=>{ const g=e.target.closest('[data-go]'); if(g) go(g.dataset.go); });

function render(){
  const list=document.getElementById('list'); if(!list) return;
  const data = forceEmpty ? [] : items;
  if(data.length===0){
    list.innerHTML = `<div class="empty">[Empty / no-result state] <span class="us">@US-XXX-Snn</span></div>`;
    return;
  }
  list.innerHTML = data.map(it=>`<div class="card" style="margin:8px 0">${it.title}
    <a class="muted" style="float:right;cursor:pointer" data-go="screenC">[Edit]</a></div>`).join('');
}

document.getElementById('t-device').onclick = e=>{ document.body.classList.toggle('mobile'); document.body.classList.toggle('desktop'); e.target.classList.toggle('on'); };
document.getElementById('t-us').onclick = e=>{ document.body.classList.toggle('show-us'); e.target.classList.toggle('on'); };
document.getElementById('t-empty').onclick = e=>{ forceEmpty=!forceEmpty; e.target.classList.toggle('on'); render(); };
render();
</script>
</body>
</html>
